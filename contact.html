<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Contact | Francis Tailoring</title>
        <meta name="description" content="Visit or contact Francis Tailoring.">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header id="site-header"></header>
        <main>
            <div class="page-head">
                <h1>Contact us</h1>
            </div>
            <section class="section">
                <div class="contact-grid">
                    <div>
                        <h2>Visit the shop</h2>
                        <p>12 Sample Street, Abuja<br>Mon–Sat, 9am–6pm</p>
                        <p>Phone: +234 800 000 0000<br>Email: hello@example.com</p>
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2470.299585035239!2d-0.4912641237974737!3d51.74584517186855!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x487643e81db8ccfd%3A0x61eda7da4869224e!2sHorsecroft%20Rd%2C%20Hemel%20Hempstead%2C%20UK!5e0!3m2!1sen!2sng!4v1792968468165!5m2!1sen!2sng" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                    </div>
                    <form class="form" data-form="message" style="margin:0" novalidate>
                        <label for="n">Name</label>
                        <input id="n" name="Name" required>
                        <label for="e">Email</label>
                        <input id="e" name="Email" type="email" required>
                        <label for="m">Message</label>
                        <textarea id="m" name="Message" rows="5" required></textarea>
                        <br>
                        <button class="btn" type="submit">Send message</button>
                        <div class="toast" role="status"></div>
                    </form>
                </div>
            </section>
        </main>
        <footer id="site-footer"></footer>
        <script src="script.js"></script>
    </body>
</html>
