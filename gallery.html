<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Gallery | Tailor Francis</title>
        <meta name="description" content="See bespoke suits, senator wear and ready-to-wear outfits made by Francis Tailoring, family tailors in Hertfordshire.">
        <link rel="canonical" href="https://tailor-francis.netlify.app/gallery.html">
        <meta name="theme-color" content="#1f3a5f">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="Tailor Francis">
        <meta property="og:locale" content="en_GB">
        <meta property="og:title" content="Our Work | Suits and Native Wear Gallery | Tailor Francis">
        <meta property="og:description" content="See bespoke suits, senator wear and ready-to-wear outfits made by Tailor Francis, family tailors in Hertfordshire.">
        <meta property="og:url" content="https://tailor-francis.netlify.app/gallery.html">
        <meta property="og:image" content="https://tailor-francis.netlify.app/img/Site1.jpg">
        <meta name="twitter:card" content="summary_large_image">
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%231f3a5f'/%3E%3Ctext x='24' y='32' text-anchor='middle' font-family='Georgia,serif' font-size='24' font-weight='700' fill='%23f3ebdd'%3EF%3C/text%3E%3C/svg%3E">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header id="site-header"></header>
        <main>
            <div class="page-head">
                <h1>Our work</h1>
                <p class="lead" style="margin:12px auto 0">Suits, native wear and ready-to-wear pieces, cut and finished in our workshop. Tap any piece to see it larger.</p>
            </div>
            <section class="section">
                <div class="filters">
                    <button class="on" data-f="all">All</button>
                    <button data-f="suits">Suits</button>
                    <button data-f="native">Native wear</button>
                    <button data-f="rtw">Ready to wear</button>
                </div>
                <p class="note center" id="count"></p>
                <div class="gallery">
                    <figure data-cat="native" data-title="Senator set">
                        <img src="senator1.webp" alt="Senator wear, set 1" loading="lazy" decoding="async">
                        <figcaption><small>Native wear</small>Senator set</figcaption>
                    </figure>
                    <figure data-cat="suits" data-title="Tailored suit">
                        <img src="suit2.jpg" alt="Tailored suit 1" loading="lazy" decoding="async">
                        <figcaption><small>Suits</small>Tailored suit</figcaption>
                    </figure>
                    <figure data-cat="rtw" data-title="Ready-to-wear outfit">
                        <img src="r2wm1.webp" alt="Ready-to-wear outfit" loading="lazy" decoding="async">
                        <figcaption><small>Ready to wear</small>Ready-to-wear outfit</figcaption>
                    </figure>
                    <figure data-cat="native" data-title="Senator set">
                        <img src="senator2.webp" alt="Senator wear, set 2" loading="lazy" decoding="async">
                        <figcaption><small>Native wear</small>Senator set</figcaption>
                    </figure>
                    <figure data-cat="suits" data-title="Tailored suit">
                        <img src="suit3.jpg" alt="Tailored suit 2" loading="lazy" decoding="async">
                        <figcaption><small>Suits</small>Tailored suit</figcaption>
                    </figure>
                    <figure data-cat="native" data-title="Senator set">
                        <img src="senator3.webp" alt="Senator wear, set 3" loading="lazy" decoding="async">
                        <figcaption><small>Native wear</small>Senator set</figcaption>
                    </figure>
                </div>
                <div class="gal-cta">
                    <h2>Like what you see?</h2>
                    <p>Send us a photo of a style you love, or book a fitting and we will make it to your measure.</p>
                    <a href="book.html" class="btn">Book a fitting</a>
                    <a href="shop.html" class="btn-outline">Shop ready-to-wear</a>
                </div>
            </section>
        </main>

        <div class="lightbox" role="dialog" aria-label="Photo viewer">
            <button class="lb-close" aria-label="Close">×</button>
            <button class="lb-prev" aria-label="Previous">‹</button>
            <button class="lb-next" aria-label="Next">›</button>
            <figure>
                <img alt="">
                <figcaption></figcaption>
                <span class="lb-num"></span>
            </figure>
        </div>
        <footer id="site-footer"></footer>
        <script src="script.js"></script>
    </body>
</html>
